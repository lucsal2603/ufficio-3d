<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1c2128">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ufficio">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icone-app/icona-192.png">
<link rel="icon" href="./icone-app/icona-192.png">
<title>L'ufficio digitale di Luca Salvemini</title>
<script type="importmap">{"imports": {"three": "./lib/three.module.js", "three/addons/": "./lib/addons/"}}</script>
<style>
  html, body { margin: 0; height: 100%; background: #cfd3da; font: 14px/1.5 -apple-system, "Helvetica Neue", sans-serif; color: #1c2128; }
  #scena { position: fixed; inset: 0; }
  #scena canvas { display: block; }
  .barra { position: fixed; top: 14px; left: 16px; right: 16px; display: flex; align-items: center; gap: 12px; pointer-events: none; }
  .barra > * { pointer-events: auto; }
  .barra h1 { margin: 0; font-size: 16px; background: rgba(255,255,255,.72); padding: 8px 14px; border-radius: 10px; backdrop-filter: blur(6px); }
  .barra h1 small { color: #5b6270; font-weight: 400; margin-left: 8px; }
  .chip { font-size: 12px; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.72); backdrop-filter: blur(6px); color: #5b6270; }
  #ticker { position: fixed; left: 16px; bottom: 16px; max-width: 60vw; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  #ticker div { background: rgba(28,33,40,.78); color: #c9cfda; font: 12px/1.4 ui-monospace, Menlo, monospace; font-style: italic; padding: 6px 10px; border-radius: 8px; animation: in .35s ease both; }
  #ticker div b { color: #8ab4ff; font-style: normal; }
  @keyframes in { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }
  .frecce { position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
  .frecce button { width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(28,33,40,.82); color: #fff; font-size: 20px; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.18); touch-action: none; user-select: none; }
  .frecce button:active { background: #3a4250; }
  #caricamento { position: fixed; inset: 0; display: grid; place-items: center; background: #cfd3da; }
  .aiuto { position: fixed; right: 16px; bottom: 16px; font-size: 12px; color: #5b6270; background: rgba(255,255,255,.72); padding: 6px 10px; border-radius: 8px; }
  [hidden] { display: none !important; }
  .barra button.apri { border: 0; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; padding: 9px 14px; border-radius: 999px; background: #1c2128; color: #fff; margin-left: auto; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  #chat { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: #f4f5f7; display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,.18); transform: translateX(105%); transition: transform .3s ease; z-index: 20; }
  #chat.aperta { transform: none; }
  #chat header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #fff; border-bottom: 1px solid #e1e4ea; }
  #chat header b { flex: 1; font-size: 15px; }
  #chat header small { display: block; color: #5b6270; font-weight: 400; font-size: 11px; }
  #chat header button { border: 0; background: #eef0f4; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 15px; }
  #chatLista { flex: 1; overflow-y: auto; padding: 14px 14px 6px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 86%; padding: 9px 12px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; line-height: 1.45; font-size: 14px; }
  .msg.luca { align-self: flex-end; background: #2b6cf6; color: #fff; border-bottom-right-radius: 4px; }
  .msg.manager { align-self: flex-start; background: #fff; border: 1px solid #e1e4ea; border-bottom-left-radius: 4px; }
  .msg time { display: block; font-size: 10px; opacity: .6; margin-top: 3px; }
  #chatStato { padding: 6px 16px; font-size: 12px; color: #5b6270; min-height: 18px; font-style: italic; }
  #chatForm { display: flex; gap: 8px; padding: 10px 12px 14px; background: #fff; border-top: 1px solid #e1e4ea; }
  #chatForm textarea { flex: 1; resize: none; border: 1px solid #d5d9e0; border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 16px; min-height: 42px; max-height: 120px; }
  #chatForm button, #chiaveForm button { border: 0; background: #1c2128; color: #fff; border-radius: 12px; padding: 0 16px; font: inherit; cursor: pointer; }
  #chatForm button:disabled { opacity: .5; cursor: default; }
  #chiaveForm { padding: 24px 18px; display: flex; flex-direction: column; gap: 10px; }
  #chiaveForm input { border: 1px solid #d5d9e0; border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 16px; }
  #chiaveForm p { margin: 0; color: #5b6270; font-size: 13px; }
  #chiaveForm button { height: 42px; }
  #notifBarra { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #eef0f4; border-bottom: 1px solid #e1e4ea; font-size: 12px; color: #5b6270; }
  #notifBarra button { border: 0; background: #fff; border: 1px solid #d5d9e0; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
  @media (max-width: 640px) { .aiuto, .chip, .barra h1 small { display: none; } #chat { width: 100vw; } }
</style>
</head>
<body>
<div id="scena"></div>
<div id="caricamento">Sto aprendo l'ufficio…</div>
<div class="barra"><h1>Ufficio digitale <small>Luca Salvemini</small></h1><span class="chip">vetrina: gli omini vivono da soli</span><button class="apri" id="apriChat">Scrivi al Manager</button></div>
<div class="frecce"><button id="giraSx" title="Gira a sinistra (freccia ←)">◀</button><button id="giraDx" title="Gira a destra (freccia →)">▶</button></div>
<div id="ticker"></div>
<div class="aiuto">trascina per girare, rotella per avvicinare</div>
<aside id="chat" aria-hidden="true">
  <header><b>Manager <small>risponde dal server dell'ufficio, con calma</small></b><button id="chiudiChat" title="Chiudi" type="button">✕</button></header>
  <form id="chiaveForm" hidden><p>Questa chat è riservata a Luca: serve la chiave dell'ufficio. La ricordo su questo dispositivo.</p><input id="chiave" placeholder="chiave" autocomplete="off" autocapitalize="none" spellcheck="false"><button>Entra</button></form>
  <div id="notifBarra" hidden><button id="attivaNotif" type="button">Attiva notifiche</button><span id="notifStato"></span></div>
  <div id="chatLista"></div>
  <div id="chatStato"></div>
  <form id="chatForm"><textarea id="chatTesto" placeholder="Scrivi al Manager…" rows="1"></textarea><button id="chatInvia">Invia</button></form>
</aside>
<script src="./personaggi.js"></script>
<script src="./vita.js"></script>
<script type="module">
import { avvia } from './ufficio3d.js';
const tick = document.getElementById('ticker');
function tieni(id, dir) { const b = document.getElementById(id); const giu = e => { e.preventDefault(); window.ufficio3d && window.ufficio3d.gira(dir); }; const su = () => window.ufficio3d && window.ufficio3d.gira(0);
  b.addEventListener('pointerdown', giu); b.addEventListener('pointerup', su); b.addEventListener('pointerleave', su); b.addEventListener('pointercancel', su); }
tieni('giraSx', 1); tieni('giraDx', -1);
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
try {
  const u = await avvia(document.getElementById('scena'), { ticker: ev => { if (ev.azione === 'avviso') window.dispatchEvent(new CustomEvent('vita', { detail: ev })); } }); window.ufficio3d = u;
  document.getElementById('caricamento').remove();
  await u.riprendiTutti(window.vita);
  try {   // notizie vere dell'ufficio pubblicate col sito: gli omini vengono a raccontarle
    const r = await fetch('./notizie.json', { cache: 'no-store' }); const n = r.ok ? await r.json() : [];
    let viste = {}; try { viste = JSON.parse(localStorage.getItem('notizie_viste') || '{}'); } catch (e) {}
    const oggi = new Date().toISOString().slice(0, 10);
    const nuove = n.filter(x => x.testo && viste[x.testo] !== oggi);
    nuove.forEach((x, i) => setTimeout(() => { u.annuncia(x.agente, x.testo); viste[x.testo] = oggi; try { localStorage.setItem('notizie_viste', JSON.stringify(viste)); } catch (e) {} }, 25000 + i * 240000));
  } catch (e) { console.warn('notizie', e); }
  window.addEventListener('vita', e => {
    const ev = e.detail; u.vita(ev);
    if (ev.silenzioso) return;
    let t = ev.azione === 'dice' ? `a ${ev.a === 'luca' ? 'Luca' : ev.a}: «${ev.testo}»` : ev.azione === 'avviso' ? `a Luca: «${ev.testo}»` : (window.vita.FRASI[ev.azione] || ev.azione); if (ev.soggetto && ev.azione !== 'dice') t += ' ' + ev.soggetto;
    const d = document.createElement('div'); d.innerHTML = `<b>${esc(ev.agente)}</b> ${esc(t)}`; tick.appendChild(d);
    while (tick.children.length > 5) tick.removeChild(tick.firstChild);
    setTimeout(() => { if (d.parentNode) d.remove(); }, 14000);
  });
} catch (e) { document.getElementById('caricamento').textContent = 'Non riesco ad aprire l\'ufficio: ' + e.message; console.error(e); }
</script>
<script>
/* Chat col Manager: parla col server dell'ufficio (sempre acceso) passando per HTTPS; serve la chiave dell'ufficio.
   La risposta arriva con calma (il server gratuito è lento): il sito chiede le novità ogni 8 secondi. */
(() => {
  const API = 'https://129-152-8-34.sslip.io';
  const $ = id => document.getElementById(id);
  const pannello = $('chat'), lista = $('chatLista'), stato = $('chatStato'), formChiave = $('chiaveForm'), form = $('chatForm'), testo = $('chatTesto'), invia = $('chatInvia');
  let chiave = ''; try { chiave = localStorage.getItem('chiave_ufficio') || ''; } catch (e) {}
  let ultimo = 0, attesa = null, inizioAttesa = 0;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const ora = ts => { try { return new Date(ts).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
  function bolla(m) {
    const d = document.createElement('div'); d.className = 'msg ' + (m.chi === 'luca' ? 'luca' : 'manager');
    d.innerHTML = esc(m.testo) + `<time>${m.chi === 'luca' ? 'tu' : 'Manager'} · ${ora(m.ts)}</time>`;
    lista.appendChild(d); lista.scrollTop = lista.scrollHeight; if (m.id > ultimo) ultimo = m.id;
  }
  async function api(path, corpo) {
    const r = await fetch(API + path, { method: corpo ? 'POST' : 'GET', cache: 'no-store',
      headers: Object.assign({ 'X-Chiave': chiave }, corpo ? { 'Content-Type': 'application/json' } : {}), body: corpo ? JSON.stringify(corpo) : undefined });
    if (r.status === 401) { chiave = ''; try { localStorage.removeItem('chiave_ufficio'); } catch (e) {} mostraChiave('Chiave sbagliata, riprova.'); throw new Error('chiave'); }
    if (!r.ok) throw new Error('server ' + r.status);
    return r.json();
  }
  function mostraChiave(msg) { formChiave.hidden = false; lista.hidden = true; form.hidden = true; stato.textContent = msg || ''; setTimeout(() => $('chiave').focus(), 350); }
  function mostraChat() { formChiave.hidden = true; lista.hidden = false; form.hidden = false; notif.hidden = false; statoNotifiche().catch(() => {}); }
  /* Notifiche push: il telefono si iscrive col servizio del browser e il server dell'ufficio lo avvisa
     quando il Manager risponde, quando un dipendente si blocca e a fine giro. Su iPhone funziona solo
     dal sito aggiunto alla schermata Home. */
  const notif = $('notifBarra'), btnNotif = $('attivaNotif'), notifStato = $('notifStato');
  const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent), standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const b64aBytes = s => { const b = atob(s.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(s.length / 4) * 4, '=')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
  async function statoNotifiche() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
      btnNotif.hidden = true; notifStato.textContent = iOS && !standalone ? 'Per le notifiche su iPhone: Condividi → Aggiungi alla schermata Home, poi apri l\'ufficio da lì.' : 'Notifiche non disponibili su questo browser.'; return;
    }
    btnNotif.hidden = false;
    const reg = await navigator.serviceWorker.register('./sw.js'); const sub = await reg.pushManager.getSubscription();
    if (sub && Notification.permission === 'granted') { btnNotif.textContent = 'Notifica di prova'; btnNotif.dataset.attive = '1'; notifStato.textContent = 'Notifiche attive su questo dispositivo.'; }
    else { btnNotif.textContent = 'Attiva notifiche'; btnNotif.dataset.attive = ''; notifStato.textContent = 'Ti avviso quando il Manager risponde o un dipendente si blocca.'; }
  }
  btnNotif.onclick = async () => {
    try {
      if (btnNotif.dataset.attive) { const r = await api('/api/push/prova', {}); notifStato.textContent = r.inviate ? 'Notifica di prova inviata.' : 'Il server non ha inviato nulla: controlla che le notifiche siano attive.'; return; }
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { notifStato.textContent = 'Permesso negato: abilitalo nelle impostazioni del browser.'; return; }
      const reg = await navigator.serviceWorker.register('./sw.js'); await navigator.serviceWorker.ready;
      const k = await api('/api/push/chiave');
      if (!k.chiave) { notifStato.textContent = 'Il server non ha ancora le chiavi per le notifiche.'; return; }
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64aBytes(k.chiave) });
      await api('/api/push/iscrivi', { iscrizione: sub.toJSON() });
      await statoNotifiche();
    } catch (e) { notifStato.textContent = 'Non riesco ad attivare le notifiche: ' + e.message; }
  };
  function fine() { clearInterval(attesa); attesa = null; invia.disabled = false; }
  function aspetta() {
    if (attesa) return;
    inizioAttesa = Date.now(); invia.disabled = true;
    const giro = async () => {
      const s = Math.round((Date.now() - inizioAttesa) / 1000);
      stato.textContent = `Il Manager ci sta pensando… ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} — sul server gratuito servono alcuni minuti, puoi anche chiudere e tornare dopo`;
      try {
        const nuovi = await api('/api/chat?dopo=' + ultimo);
        nuovi.forEach(bolla);
        const risposta = nuovi.filter(m => m.chi === 'manager').pop();
        if (risposta) { fine(); stato.textContent = ''; try { window.ufficio3d && window.ufficio3d.annuncia('manager', risposta.testo.slice(0, 160)); } catch (e) {} return; }
        if (s > 1800) { fine(); stato.textContent = 'Nessuna risposta dopo mezz\'ora: riapri la chat più tardi.'; }
      } catch (e) { if (e.message === 'chiave') { fine(); return; } stato.textContent = 'Non raggiungo il server, riprovo tra poco…'; }
    };
    giro(); attesa = setInterval(giro, 8000);
  }
  async function apri() {
    pannello.classList.add('aperta'); pannello.setAttribute('aria-hidden', 'false');
    if (!chiave) { mostraChiave(''); return; }
    mostraChat();
    try {
      stato.textContent = 'Carico la conversazione…';
      const storia = await api('/api/chat?n=30'); lista.innerHTML = ''; ultimo = 0; storia.forEach(bolla); stato.textContent = '';
      const st = await api('/api/chat/stato'); if (st.in_coda) aspetta();
      if (!attesa) testo.focus();
    } catch (e) { if (e.message !== 'chiave') stato.textContent = 'Non raggiungo il server dell\'ufficio (' + e.message + ').'; }
  }
  function chiudi() { pannello.classList.remove('aperta'); pannello.setAttribute('aria-hidden', 'true'); }
  $('apriChat').onclick = apri; $('chiudiChat').onclick = chiudi;
  formChiave.onsubmit = e => { e.preventDefault(); const v = $('chiave').value.trim(); if (!v) return; chiave = v; try { localStorage.setItem('chiave_ufficio', v); } catch (err) {} $('chiave').value = ''; apri(); };
  form.onsubmit = async e => {
    e.preventDefault(); const t = testo.value.trim(); if (!t || invia.disabled) return; invia.disabled = true;
    try { const r = await api('/api/chat/invia', { testo: t }); bolla({ id: r.id, chi: 'luca', testo: t, ts: new Date().toISOString() }); testo.value = ''; aspetta(); }
    catch (err) { invia.disabled = false; if (err.message !== 'chiave') stato.textContent = 'Invio fallito: ' + err.message; }
  };
  testo.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
  if (/[?&]chat/.test(location.search)) apri();   // ?chat nell'indirizzo apre subito la chat
})();
</script>
</body>
</html>
